name: lint

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: statusline.mjs parses
        run: node --check statusline/statusline.mjs

      - name: install.sh parses
        run: bash -n install.sh

      - name: settings.example.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('settings.example.json','utf8'))"

      - name: skills/**/*.js and *.mjs parse
        run: |
          find skills -name '*.js' -o -name '*.mjs' | while read -r f; do
            echo "checking $f"
            node --check "$f"
          done

      - name: skills/**/*.sh parse
        run: |
          find skills -name '*.sh' | while read -r f; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: hooks/**/*.ps1 parse
        shell: pwsh
        run: |
          Get-ChildItem hooks -Filter *.ps1 -Recurse | ForEach-Object {
            Write-Output "checking $($_.FullName)"
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: workflow e valido estruturalmente
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3'
          python3 scripts/validate-workflow.py .github/workflows/lint.yml

      - name: invariantes do repo (SKILL.md por skill, fim de linha)
        run: bash scripts/check-drift.sh --repo-only

  install-smoke:
    # Sintaxe valida nao prova que instalou: o bug que motivou este job era um
    # install.sh que rodava limpo e deixava o ~/.claude pela metade.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: dry-run nao escreve nada
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/dry"
          ./install.sh --dry-run
          if [ -d "$CLAUDE_CONFIG_DIR" ] && [ -n "$(ls -A "$CLAUDE_CONFIG_DIR" 2>/dev/null)" ]; then
            echo "FALHOU: --dry-run escreveu em $CLAUDE_CONFIG_DIR"; exit 1
          fi

      - name: argumento desconhecido falha em vez de instalar
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/badarg"
          if ./install.sh --skils >/dev/null 2>&1; then
            echo "FALHOU: argumento invalido foi aceito"; exit 1
          fi

      - name: instala e todo alvo existe
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/home"
          ./install.sh
          for f in CLAUDE.md RTK.md statusline/statusline.mjs scripts/reap-orphans.ps1; do
            test -e "$CLAUDE_CONFIG_DIR/$f" || { echo "FALTOU $f"; exit 1; }
          done
          for d in skills/*/; do
            name="$(basename "$d")"
            test -e "$CLAUDE_CONFIG_DIR/skills/$name" || { echo "FALTOU skill $name"; exit 1; }
          done
          # Onde symlink funciona (Linux), tem que ser symlink de verdade.
          test -L "$CLAUDE_CONFIG_DIR/CLAUDE.md" || { echo "esperava symlink"; exit 1; }

      - name: reinstalar re-sincroniza em vez de virar no-op
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/copy"
          ./install.sh --copy
          echo "DIVERGENCIA" >> "$CLAUDE_CONFIG_DIR/CLAUDE.md"
          ./install.sh --copy
          if grep -q DIVERGENCIA "$CLAUDE_CONFIG_DIR/CLAUDE.md"; then
            echo "FALHOU: segunda execucao nao re-sincronizou"; exit 1
          fi

      - name: arquivo do usuario e preservado sem --force
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/mine"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          echo "meu proprio" > "$CLAUDE_CONFIG_DIR/CLAUDE.md"
          ./install.sh
          grep -q "meu proprio" "$CLAUDE_CONFIG_DIR/CLAUDE.md" || { echo "FALHOU: sobrescreveu arquivo do usuario"; exit 1; }
          ./install.sh --force
          bak="$(find "$CLAUDE_CONFIG_DIR/.claude-setup-backups" -name CLAUDE.md -type f | head -1)"
          [ -n "$bak" ] || { echo "FALHOU: --force nao guardou backup"; exit 1; }
          grep -q "meu proprio" "$bak" || { echo "FALHOU: backup sem o conteudo original"; exit 1; }
          if [ -e "$CLAUDE_CONFIG_DIR/CLAUDE.md.bak" ]; then
            echo "FALHOU: backup ficou ao lado do original"; exit 1
          fi

      - name: --force nao deixa backup dentro de skills/
        run: |
          # O defeito que este teste existe para impedir, medido em producao e
          # nao imaginado: --force renomeava skills/session-end para
          # skills/session-end.bak, que continua sendo um diretorio com um
          # SKILL.md dentro. O Claude Code indexa por SKILL.md, nao por nome de
          # pasta, entao cinco skills fantasma ficaram carregadas junto com as
          # reais, cada par disputando o mesmo `name:` do frontmatter.
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/bakskills"
          ./install.sh --copy
          ./install.sh --copy --force
          extra="$(find "$CLAUDE_CONFIG_DIR/skills" -maxdepth 1 -name '*.bak' | wc -l)"
          [ "$extra" -eq 0 ] || { echo "FALHOU: $extra backup(s) dentro de skills/"; exit 1; }
          repo_skills="$(find skills -maxdepth 1 -mindepth 1 -type d | wc -l)"
          live_skills="$(find "$CLAUDE_CONFIG_DIR/skills" -maxdepth 1 -mindepth 1 | wc -l)"
          [ "$repo_skills" -eq "$live_skills" ] || {
            echo "FALHOU: esperava $repo_skills skills instaladas, achei $live_skills"; exit 1; }
          # E o backup existe mesmo, fora do caminho que a ferramenta varre.
          find "$CLAUDE_CONFIG_DIR/.claude-setup-backups" -name SKILL.md -type f | head -1 | grep -q . \
            || { echo "FALHOU: --force nao guardou as skills em lugar nenhum"; exit 1; }

      - name: --settings preserva o resto do settings.json
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/settings"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          echo '{"model":"opus","permissions":{"allow":["Bash(git status*)"]}}' > "$CLAUDE_CONFIG_DIR/settings.json"
          ./install.sh --settings
          node -e '
            const j = JSON.parse(require("fs").readFileSync(process.env.CLAUDE_CONFIG_DIR + "/settings.json","utf8"));
            if (j.model !== "opus") throw new Error("perdeu model");
            if (!j.permissions?.allow?.length) throw new Error("perdeu permissions");
            if (!j.statusLine?.command) throw new Error("nao escreveu statusLine");
          '

      - name: --uninstall remove so o que instalou
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/uninst"
          ./install.sh
          echo "nao me apague" > "$CLAUDE_CONFIG_DIR/MEU.md"
          ./install.sh --uninstall
          test -e "$CLAUDE_CONFIG_DIR/MEU.md" || { echo "FALHOU: apagou arquivo alheio"; exit 1; }
          test ! -e "$CLAUDE_CONFIG_DIR/CLAUDE.md" || { echo "FALHOU: nao removeu o que instalou"; exit 1; }

      - name: statusline roda e nao quebra com stdin vazio
        run: |
          echo '{}' | node statusline/statusline.mjs > /dev/null
          printf '' | node statusline/statusline.mjs > /dev/null

  drift-check-works:
    # O --repo-only nao enxerga divergencia entre o repo e uma instalacao, que e
    # justamente a divergencia que este repo quer pegar. Um runner nao tem
    # ~/.claude -- mas pode construir um, e ai o modo de comparacao fica
    # testavel. Isto prova o INSTRUMENTO, nao a maquina de ninguem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: instala numa CLAUDE_CONFIG_DIR temporaria
        run: |
          set -euo pipefail
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-home" >> "$GITHUB_ENV"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-home" ./install.sh --skills --copy

      - name: sem divergencia logo apos instalar
        run: bash scripts/check-drift.sh

      - name: divergencia real e detectada
        run: |
          set -euo pipefail
          target="$(find "$CLAUDE_CONFIG_DIR/skills" -name 'SKILL.md' -print -quit)"
          test -n "$target" || { echo "nenhum SKILL.md instalado"; exit 1; }
          echo "uma diferenca real" >> "$target"
          if bash scripts/check-drift.sh; then
            echo "FALHOU: o check ficou verde com divergencia real"; exit 1
          fi
          echo "ok: divergencia detectada"

      - name: diferenca so de fim de linha e ignorada
        run: |
          set -euo pipefail
          target="$(find "$CLAUDE_CONFIG_DIR/skills" -name 'SKILL.md' -print -quit)"
          rel="${target#"$CLAUDE_CONFIG_DIR/skills/"}"
          sed 's/$/\r/' "skills/$rel" > "$target"
          bash scripts/check-drift.sh

  symlink-probe-windows:
    # O unico job capaz de ficar vermelho se alguem tirar
    # MSYS=winsymlinks:nativestrict do can_symlink(). Nenhum job Linux consegue:
    # o bug e especifico do Git Bash no Windows.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: o probe do install.sh concorda com a realidade da maquina
        run: bash scripts/symlink-oracle.sh --require-capable
